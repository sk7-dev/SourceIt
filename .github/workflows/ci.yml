name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # apps/api's integration tests spin up a disposable Postgres via
      # Testcontainers — GitHub's ubuntu-latest runners have Docker available
      # by default, no extra setup needed.
      - run: pnpm test
